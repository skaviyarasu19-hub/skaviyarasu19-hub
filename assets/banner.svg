<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="text" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="orb">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>

  <circle cx="180" cy="80" r="120" fill="url(#orb)">
    <animate attributeName="cx" values="180;260;180" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1400" cy="320" r="140" fill="url(#orb)">
    <animate attributeName="cy" values="320;250;320" dur="10s" repeatCount="indefinite"/>
  </circle>

  <text x="800" y="195"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="74"
        font-weight="800"
        fill="url(#text)"
        filter="url(#glow)">
      KAVIYARASU S
  </text>

  <text x="800" y="255"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="26"
        letter-spacing="4"
        fill="#94A3B8">
      JAVA • AI • CLOUD • UI/UX
  </text>

  <line x1="560" y1="286" x2="1040" y2="286"
        stroke="#38BDF8"
        stroke-width="2"
        opacity=".5">
      <animate attributeName="stroke-opacity"
               values=".2;.9;.2"
               dur="3s"
               repeatCount="indefinite"/>
  </line>
</svg>
